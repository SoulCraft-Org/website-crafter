# Bumps every action pin once a week in one pull request (Git Crafter templates/ci/dependabot.yml), Git Crafter's
# ci-standard.yml pin in ci.yml included. A new release waits 14 days first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
