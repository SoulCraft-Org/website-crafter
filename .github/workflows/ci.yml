name: ci

# The Git Crafter CI standard (SoulCraft-Org/git-crafter templates/ci/README.md): this repo calls Git Crafter's
# reusable workflow, which runs each job on GitHub's hosted runners. main's ruleset requires its one verdict,
# ci / ci-ok. Dependabot's github-actions entry bumps the pin, and tools/voice_lint.sh reads the lint at the same pin.
# paths names what a change must touch to run the jobs; any other change skips them, and ci-ok still reports.
on:
  pull_request:
  workflow_dispatch: # manual runs
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels a pull request's older run; a push to main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: SoulCraft-Org/git-crafter/.github/workflows/ci-standard.yml@6899e46174d55abddc0324ee7c61c6f1e3631561 # v7.1.0
    with:
      paths: |
        .claude-plugin/**
        plugin/**
        tools/**
        templates/**
        tests/**
        maps/**
        pack.json
        package.json
        package-lock.json
        **/*.md
        .github/workflows/ci.yml
        .github/dependabot.yml
      # Only a change to the page tests, the fixture sites or Playwright starts a browser.
      standard-paths: |
        templates/tests/**
        tests/fixture/**
        package.json
        package-lock.json
        .github/workflows/ci.yml
      # The pinned Git Crafter's .nvmrc, for its engine in tests/engine.sh; tests/pins.test.mjs holds the two equal.
      node-version: "26"
      # PyYAML for tools/check_plugin.py, which parses each skill's front matter as Claude Code does.
      python-version: "3.14"
      pip-requirements: tools/requirements.txt
      short: |
        python3 -I tools/check_plugin.py --self-test
        python3 -I tools/check_plugin.py
        bash tools/voice_lint.sh
        python3 -I templates/hooks/guards.py --self-test
        python3 -I tools/export_public.py --self-test
        # The starters against Git Crafter's engine at the pin above: seconds of work, so the short job on ubuntu-slim.
        bash tests/engine.sh
      # The page tests on the good fixture site, where every test passes, then on the bad one, where every test must fail.
      standard: |
        npx playwright install --with-deps chromium
        SITE_PAGES=/,/about/ npx playwright test -c tests/fixture/playwright.config.ts
        node tests/fixture/check-bad.mjs
