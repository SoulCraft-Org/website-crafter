<!doctype html>
<html lang="en">
<head>
<title>About the fixture site</title>
<meta name="description" content="The second page of the fixture site.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/styles.css">
<script>
  // Before first paint: a stored choice, or a visitor who asks for reduced motion, starts the page still.
  try {
    const stored = localStorage.getItem("motion");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (stored === "paused" || (stored === null && reduce)) document.documentElement.dataset.motion = "paused";
  } catch {}
</script>
<script type="module" src="/motion.js"></script>
</head>
<body>
<header><a href="/">Home</a> <a href="/about/">About</a> <button type="button" aria-pressed="false" data-motion-toggle>Pause motion</button></header>
<main>
<h1>About</h1>
<p>This page says what the site is for. It has no demo of its own.</p>
</main>
</body>
</html>
